// Imported contracts inspect source, resources and bytecode. Assemble their
// layout from actual compilation inputs, never from docs/DamageNexus-main.
// Sync removes stale files; FAIL prevents accidentally shadowing a class.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
def fixture = layout.buildDirectory.dir('contract-workspace')
def prepareContracts = tasks.register('prepareDamageContracts', Sync) {
    dependsOn tasks.named('classes'), tasks.named('compileTestJava')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    into fixture
    from(sourceSets.main.java) { into 'src/main/java' }
    from(sourceSets.test.java) { into 'src/test/java' }
    from(new File(baselineRoot, 'common/src/main/resources')) { into 'src/main/resources' }
    from(new File(baselineRoot, 'targets/neoforge-26.1.2/src/main/resources')) { into 'src/main/resources' }
    from(sourceSets.main.output.classesDirs) { into 'build/classes/java/main' }
}
tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn prepareContracts
    workingDir fixture
}
