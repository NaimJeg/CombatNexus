plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-26.1.2"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// common/ is a shared source tree that also compiles standalone
// (`gradlew -p common build`, see common/build.gradle). Everything without a
// confirmed version difference lives there, so its sources are compiled into
// this target by source-set sharing. Its shared resources directory is wired in
// by gradle/target-conventions/publish.gradle.
sourceSets {
    main {
        java.srcDir "$buildDir/generated/common-main"
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java') {
        // This target's version differences are registered here: exclude one
        // path per common file that this target replaces with its own
        // implementation, for example
        //     exclude 'com/example/network/ChunkPacket.java'
        // Everything not listed here stays shared with every other target.
    }
    into "$buildDir/generated/common-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }
tasks.named('sourcesJar', Jar).configure {
    dependsOn 'prepareCommonSources'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

neoForge {
    version = neoforge_261_version

    runs {
        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            clientData()
            programArguments.addAll('--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('../../common/src/main/resources').absolutePath)
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
        content { includeGroup 'com.sighs.autojs' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
    mavenLocal()
}

dependencies {
    jarJar project(':combatnexus_compat')
    runtimeOnly project(':combatnexus_compat')
    // Debug tooling only; not bundled or published as a CombatNexus dependency.
    runtimeOnly 'com.sighs.autojs:AutoJS-neoforge-26.1:1.0.1'
    // AutoJS declares Rhino in mod metadata, but omits it from its POM.
    runtimeOnly 'curse.maven:rhino-416294:8463898'
    // NeoForge development mods; pinned files and official sources: docs/DEVELOPMENT.md.
    runtimeOnly 'curse.maven:spark-361579:8918574' // 1.10.187
    runtimeOnly 'curse.maven:jei-238222:9384706' // 29.53.0.115 (includes MezzConfig)
    runtimeOnly 'curse.maven:just-enough-characters-250702:9163773' // 4.6.9
    // Compatibility testing: Apotheosis and its required mod dependencies.
    if (providers.gradleProperty('verificationCompatibility').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly 'curse.maven:apotheosis-313970:9054740' // 9.1.0
    }
    if (providers.gradleProperty('verificationCompatibility').map { it.toBoolean() }.getOrElse(false)
            || providers.gradleProperty('verificationAttributesOnly').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly 'curse.maven:placebo-283644:8502256' // 10.0.2
        runtimeOnly 'curse.maven:apothic-attributes-898963:9076588' // 3.1.0
    }

    implementation "curse.maven:jade-324717:9156414"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version     : neoforge_261_minecraft_version,
            neoforge_version      : neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id                : mod_id,
            mod_name              : mod_name,
            mod_license           : mod_license,
            mod_version           : mod_version,
            mod_authors           : mod_authors,
            mod_description       : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
