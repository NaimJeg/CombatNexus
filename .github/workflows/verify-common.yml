name: Verify Common Changes

on:
  push:
    paths:
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/build-target.ps1'
      - 'scripts/discover-targets.ps1'
      - 'scripts/verify-baseline.py'
      - 'scripts/generate-test-arena.py'
      - 'docs/migration/damage-source-manifest.json'
      - '.github/workflows/verify-common.yml'
      - 'targets/**'
  pull_request:
    paths:
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/build-target.ps1'
      - 'scripts/discover-targets.ps1'
      - 'scripts/verify-baseline.py'
      - 'scripts/generate-test-arena.py'
      - 'docs/migration/damage-source-manifest.json'
      - '.github/workflows/verify-common.yml'
      - 'targets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-common-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-targets:
    name: Discover Enabled Targets
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Build target matrix
        id: discover
        shell: pwsh
        run: |
          $matrix = .\scripts\discover-targets.ps1
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  common-tests:
    name: Common Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # common uses the NeoForge 26.1.2 reference adapters and classpath.
      - name: Run common unit tests
        shell: pwsh
        run: .\gradlew.bat -p common test --console plain --no-daemon

  target-builds:
    name: ${{ matrix.target }} (JDK ${{ matrix.java }})
    needs: [discover-targets, common-tests]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build target and run tests
        shell: pwsh
        run: .\scripts\build-target.ps1 -Target ${{ matrix.target }} -Attempts ${{ matrix.attempts }}
      - name: Verify damage runtime on dedicated GameTest server
        if: matrix.target == 'neoforge-26.1.2'
        working-directory: targets/neoforge-26.1.2
        shell: pwsh
        run: .\gradlew.bat runGameTestServer --console plain --no-daemon
      - uses: actions/setup-python@v5
        if: matrix.target == 'neoforge-26.1.2'
        with:
          python-version: '3.12'
      - name: Verify packaged migration baseline
        if: matrix.target == 'neoforge-26.1.2'
        shell: pwsh
        run: python scripts/verify-baseline.py
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-jdk-${{ matrix.java }}
          path: |
            targets/${{ matrix.target }}/build/libs/*.jar
            targets/${{ matrix.target }}/build/test-results/**
            targets/${{ matrix.target }}/build/gametest-results.xml
          if-no-files-found: ignore
